name: release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds a self-contained single-file Windows x64 exe and attaches it to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # manual re-run from the Actions tab — pick a v* TAG under "Use workflow from"

permissions:
  contents: write          # needed to create the Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The version baked into the exe, the zip name and the Release are all derived from the tag name, so
      # a manual run started from a branch (ref_name = "main") could only fail obscurely or ship something
      # mislabelled. Refuse it up front. Skipped entirely on the normal tag-push path.
      - name: Require a version tag
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          Write-Host "::error::Releases are built from a v* tag, but this run is on $env:REF_TYPE '$env:REF_NAME'. Re-run the workflow and select the tag under 'Use workflow from' (or push the tag)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file overlay
        shell: pwsh
        run: |
          # Derive the baked-in assembly version straight from the tag (v0.8.1 -> 0.8.1) so the
          # binary can never disagree with the release it ships in, regardless of the csproj value.
          $ver = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish src/POE2Radar.Overlay/POE2Radar.Overlay.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=$ver `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:Deterministic=true -p:ContinuousIntegrationBuild=true `
            -o publish
          Remove-Item publish/*.pdb -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Copy-Item README.md, LICENSE publish/
          Compress-Archive -Path publish/* -DestinationPath "POE2Radar-$tag-win-x64.zip" -Force

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: POE2Radar-*-win-x64.zip
          generate_release_notes: true
